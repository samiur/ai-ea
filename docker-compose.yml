# Local development services for the AI Executive Assistant.
# Matches the postgres:15 service used by CI (.github/workflows/ci.yml).
services:
  postgres:
    image: postgres:15
    container_name: ai-ea-postgres
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-ea

networks:
  ai-ea:

volumes:
  postgres-data:
